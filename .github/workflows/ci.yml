name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm hydra:prepare
      - run: pnpm hydra:up
      - run: pnpm hydra:wait
      - run: pnpm hydra:smoke
      - run: pnpm test:integration
      - run: pnpm demo:verify
      - run: pnpm test:e2e
      - run: pnpm benchmark
      - if: always()
        run: docker compose logs hydradb
